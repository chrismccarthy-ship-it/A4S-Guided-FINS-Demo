<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
</head>
<body>
<title>Agentforce Service — Financial Services Guided Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
/* ============================================================
   Agentforce Service — FinServ Guided Demo (single file)
   SLDS-flavored Service Console replica. Committed light UI.
   Layouts + colors matched to reference screenshots.
   ============================================================ */
:root{
  color-scheme: light;
  --brand:#0176d3; --brand-dark:#014486; --brand-1:#1b96ff; --brand-2:#0b5cab;
  --ink:#16202c; --ink-2:#3e4b5b; --muted:#6b7684; --faint:#98a3b1;
  --line:#e5e9ee; --line-2:#d6dce3; --card:#ffffff; --panel:#f5f7fa; --bg:#eef1f5;
  --good:#2e844a; --good-bg:#ecfbef; --warn:#a86403; --warn-bg:#fff3e0;
  --bad:#ba0517; --bad-bg:#fdeceb; --pink:#e0517a; --info-bg:#eaf5fe;
  --purple:#5b2bb3;
  --radius:12px; --radius-s:8px;
  --shadow-1:0 1px 2px rgba(16,32,50,.05),0 2px 8px rgba(16,32,50,.06);
  --shadow-2:0 10px 34px rgba(16,32,50,.18);
  /* Focus/spotlight colour. --guide-rgb is the same colour as an "r,g,b" triplet so
     every ring, dot and pulse can be tinted from one value. applyOrg() overwrites both
     from the brand hex entered on the sign-on placemat; these are the no-brand defaults. */
  --guide:#1b96ff; --guide-rgb:27,150,255; --guide-soft:rgba(var(--guide-rgb),.16);
  --sans:"Salesforce Sans","SalesforceSans-Regular","Public Sans",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.45}
.app{min-height:100vh;display:flex;flex-direction:column;padding-bottom:118px}
button{font-family:inherit;cursor:pointer}
a{color:var(--brand);text-decoration:none}
[hidden]{display:none !important}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- console chrome ---------- */
.gh{height:50px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px;background:#fff;border-bottom:1px solid var(--line-2)}
.gh .ghleft{justify-self:start;display:flex;align-items:center;gap:8px;min-width:0}
.gh .appwaffle{width:15px;height:15px;flex:none;background:radial-gradient(circle,#7084a8 1.1px,transparent 1.4px);background-size:5px 5px;background-position:1px 1px}
.gh .appname{font-weight:700;font-size:13.5px;color:var(--ink);white-space:nowrap;flex:none}
.gh .ghleft .tab{height:30px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid transparent;border-radius:6px;font-size:13px;color:var(--ink-2);white-space:nowrap;flex:none}
.gh .ghleft .tab.active{background:#fff;border-color:var(--line-2);font-weight:700;color:var(--ink)}
.gh .ghleft .tab.voice.active{background:#d7f5e3;border-color:#8fdcae;color:#0a4a22}
.gh .ghleft .org{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;color:var(--ink);margin-left:4px;white-space:nowrap;flex:none}
.gh .ghleft .org .swatch{width:12px;height:12px;border-radius:3px;background:var(--org-accent,#5b2bb3);flex:none}
.gh .ghmid{justify-self:center;position:relative;display:flex;align-items:center}
.gh .cloud{display:flex;align-items:center;flex:none}
.gh .search{flex:0 0 auto;width:clamp(260px,44vw,560px);height:34px;border:1px solid var(--line-2);border-radius:8px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--faint);font-size:13px}
.gh .ask{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:12px;height:30px;border:1px solid var(--line-2);color:var(--brand);background:#fff;border-radius:16px;padding:0 14px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.gh .icons{justify-self:end;display:flex;align-items:center;gap:14px;color:#54698a;font-size:15px}
.gh .icons .gi{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.gh .icons .gi svg{width:19px;height:19px;display:block}
.gh .icons .star svg{width:14px;height:14px}
.gh .bell svg{width:19px;height:19px;display:block;vertical-align:middle}
.gh .icons .star{border:1px solid var(--line-2);border-radius:5px;padding:2px 5px;gap:2px;color:#54698a}
.gh .icons .star i{font-size:8px;font-style:normal;color:var(--faint)}
.gh .icons .plus{width:21px;height:21px;border-radius:50%;background:#0176d3;color:#fff;font-size:13px;font-weight:700}
.gh .bell{position:relative}
.gh .bell .dot{position:absolute;top:-6px;right:-7px;min-width:15px;height:15px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 3px;transform:scale(0);transition:transform .3s cubic-bezier(.2,1.5,.4,1)}
.gh .bell.on .dot{transform:scale(1)}
.gh .avatar{width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,#032d60,#0b5cab);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.bellwrap{position:relative;display:inline-flex}
.bellpanel{position:absolute;right:0;top:30px;width:308px;max-width:80vw;background:#fff;border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-2);z-index:70;overflow:hidden}
.bellpanel .bp-h{padding:9px 13px;font-weight:800;font-size:12px;color:var(--ink);border-bottom:1px solid var(--line);background:var(--panel)}
.notif{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:flex-start;cursor:default}
.notif:last-child{border-bottom:0}
.notif .nic{width:24px;height:24px;border-radius:6px;background:var(--info-bg);color:var(--brand);display:grid;place-items:center;font-size:12px;flex:none}
.notif .nt{font-weight:700;font-size:12.5px;color:var(--ink)}
.notif .ns{font-size:11.5px;color:var(--muted);margin-top:2px}
.notif-empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}

.subhead{height:42px;display:flex;align-items:center;gap:4px;padding:0 12px;background:#f7f9fb;border-bottom:1px solid var(--line)}
.subhead .appwaffle{width:15px;height:15px;flex:none;background:radial-gradient(circle,#7084a8 1.1px,transparent 1.4px);background-size:5px 5px;background-position:1px 1px;margin:0 4px}
.subhead .appname{font-weight:700;font-size:13.5px;margin-right:10px;color:var(--ink);display:flex;align-items:center;gap:6px}
.tab{height:30px;display:flex;align-items:center;gap:8px;padding:0 13px;border:1px solid transparent;border-radius:6px 6px 0 0;font-size:13px;color:var(--ink-2)}
.tab.active{background:#fff;border-color:var(--line);border-bottom-color:#fff;font-weight:600}
.tab .close{color:var(--faint);font-size:11px}
.tab .chev{color:var(--faint);font-size:11px;margin:0 1px}
.tab.folder::before{content:"📁";margin-right:3px}
.tab.voice::before{content:"📞";margin-right:5px}
.tab.voice.active{background:#d7f5e3;border-color:#8fdcae;border-bottom-color:#d7f5e3;color:#0a4a22;font-weight:700}

.navtabs{display:flex;gap:2px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);height:40px;align-items:flex-end;overflow-x:auto}
.navtabs .nt{padding:9px 13px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.navtabs .nt.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}

/* console body = omni-channel rail + workarea */
.console{display:flex;flex:1;min-height:0}
.workarea{flex:1;min-width:0;display:flex;flex-direction:column}
.omnirail{width:54px;flex:none;background:#fff;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:0;padding:0}
.omnirail .oicell{display:flex;align-items:center;justify-content:center;padding:11px 0;border-bottom:1px solid #DCDCDC}
.omnirail .oicell:last-child{border-bottom:0}
.omnirail .oi{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:17px;color:#54698a}
.omnirail .oi svg{width:23px;height:23px;display:block}
.omnirail .oi.omni{width:40px;height:40px;background:#107CAD;color:#fff;border-radius:11px;font-size:16px;font-weight:800}
.omnirail .oi.omni svg{width:22px;height:22px}
.omnirail .oi.cases{width:40px;height:40px;background:#03234D;border-radius:11px}
.omnirail .oi.cases svg{width:22px;height:22px}
.omnirail .oi.dot{width:16px;height:16px;border-radius:50%;background:#2E844A}
.omnirail .oi.hasnotif{position:relative}
.omnirail .oi.hasnotif::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:#ea001e;border:1.6px solid #fff;animation:railpulse 1.3s ease-in-out infinite}
@keyframes railpulse{0%{box-shadow:0 0 0 0 rgba(234,0,30,.55)}70%{box-shadow:0 0 0 6px rgba(234,0,30,0)}100%{box-shadow:0 0 0 0 rgba(234,0,30,0)}}
/* Omni-Channel Inbox panel (opens from the rail) */
.omniinbox{position:fixed;left:54px;top:50px;bottom:118px;width:340px;max-width:72vw;background:#fff;border-right:1px solid var(--line-2);box-shadow:8px 0 22px rgba(16,32,50,.09);z-index:38;display:flex;flex-direction:column;overflow:hidden}
.oi-head{display:flex;align-items:center;gap:11px;padding:13px 16px;font-weight:800;font-size:17px;color:#04315f}
.oi-head .oi-ic{width:34px;height:34px;border-radius:50%;background:#0b7fd4;color:#fff;display:grid;place-items:center;flex:none}
.oi-head .oi-ic svg{width:18px;height:18px;display:block}
.oi-head .oi-head-t{flex:1}
.oi-head .oi-tools{margin-left:auto;display:flex;align-items:center;gap:14px}
.oi-head .oi-tools svg{width:20px;height:20px;display:block;cursor:pointer}
.oi-caret{color:var(--brand);font-size:9px}
.oi-search .oi-mag{width:15px;height:15px;color:#7084a8;flex:none}
.oi-status{position:relative;margin:2px 12px 0;border:1px solid var(--line);border-radius:8px;padding:12px 13px;display:flex;align-items:center;gap:8px}
.oi-status-lbl{font-weight:700;font-size:14px;flex:1;color:var(--ink)}
.oi-status-btn{border:1px solid var(--line-2);border-radius:16px;padding:5px 11px;background:#fff;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);cursor:pointer}
.oi-status-btn .oi-dot{width:9px;height:9px;border-radius:50%;background:var(--good)}
.channeldd{position:absolute;top:48px;right:0;width:290px;background:#fff;border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-2);z-index:42;padding:6px 0;max-height:320px;overflow:auto}
.ch-item{display:flex;align-items:center;gap:12px;padding:9px 16px;font-size:14px;color:var(--ink)}
.ch-item.sel{background:#e7f6ee}
.ch-dot{width:11px;height:11px;border-radius:50%;flex:none}
.ch-dot.good{background:#2e844a}.ch-dot.busy{background:#fe9339}.ch-dot.off{background:#fff;border:1.5px solid var(--line-2)}
.oi-tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);padding:12px 16px 0;margin-top:12px}
.oi-tabs span{padding-bottom:9px;font-size:13.5px;color:var(--ink-2);border-bottom:2px solid transparent}
.oi-tabs span.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.oi-search{margin:12px;border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;color:var(--faint);font-size:13px;display:flex;align-items:center;gap:8px}
.oi-items-head{display:flex;justify-content:space-between;padding:0 16px 8px;font-size:12px;color:var(--muted)}
.oi-items-head span:last-child{color:var(--good);font-weight:600}
.oi-item{padding:12px 16px;border-top:1px solid var(--line)}
.oi-item.active{background:#fdf3e0}
.oi-item-top{display:flex;align-items:flex-start;gap:8px}
.oi-item-top b{font-size:14px;flex:1;color:var(--ink)}
.oi-accept{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);background:#fff;color:var(--good);font-weight:800;font-size:14px;cursor:pointer;flex:none}
.oi-paused{background:#6b7280;color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px;flex:none}
.oi-item-sub{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.4}
.oi-item-meta{font-size:12px;color:var(--muted);margin-top:6px}
.mnorec{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.stage{flex:1;min-height:0}

/* ============================================================
   LANDING
   ============================================================ */
.landing-wrap{background:radial-gradient(1200px 520px at 50% -60px,#eaf2fc 0%,#f4f8fc 46%,#ffffff 100%);min-height:100vh}
.landing{max-width:1240px;margin:0 auto;padding:42px 24px 40px;text-align:center}
.sflogo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px}
.aflock{font-size:29px;font-weight:800;color:#032D60;line-height:1;letter-spacing:-.015em;white-space:nowrap}
.aflock .afsub{font-weight:600}
@media(max-width:560px){.aflock{font-size:22px;white-space:normal}}
.eyebrow-pill{display:inline-block;background:#e6f1fb;color:#0b7fd4;font-weight:800;letter-spacing:.1em;font-size:12.5px;text-transform:uppercase;padding:8px 18px;border-radius:20px}
.landing h1{font-size:52px;line-height:1.03;margin:22px 0 36px;font-weight:400;text-wrap:balance;color:#1a1a1a}
.landing h1 b{font-weight:800}
.brandfields{max-width:620px;margin:0 auto}
.qlabel{display:block;font-size:15px;font-weight:700;color:var(--ink);margin:0 0 12px}
.namein{width:100%;height:54px;border:1.5px solid var(--line-2);border-radius:8px;padding:0 16px;font-size:17px;color:var(--ink);background:#fff;text-align:center;box-shadow:var(--shadow-1)}
.namein:focus{outline:none;border-color:var(--brand-1);box-shadow:0 0 0 3px var(--guide-soft)}
.brandfields .hint{font-size:12px;color:var(--faint);margin-top:9px}
.hexrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px}
.hexrow .sw{width:26px;height:26px;border-radius:6px;border:1px solid var(--line-2);background:var(--org-accent,#5b2bb3);flex:none}
.hexin{width:140px;height:38px;border:1.5px solid var(--line-2);border-radius:8px;padding:0 12px;font-size:14px;text-align:center;font-family:Consolas,monospace;text-transform:uppercase;background:#fff}
.hexin:focus{outline:none;border-color:var(--brand-1);box-shadow:0 0 0 3px var(--guide-soft)}
.hexrow .cap{font-size:12px;color:var(--faint)}
.filterbar{display:flex;align-items:flex-start;justify-content:center;gap:22px;flex-wrap:wrap;margin:36px 0 8px}
.filtergrp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filterlbl{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.filterpills{display:flex;gap:8px;flex-wrap:wrap}
.filterpill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line-2);border-radius:18px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:.12s}
.filterpill:hover{border-color:var(--brand-1)}
.filterpill.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chanclear{align-self:center;background:none;border:none;color:var(--brand);font-size:12.5px;font-weight:700;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px;margin-top:22px;text-align:left;align-items:start}
.vcard .vctags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.vctag{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:3px 10px;font-size:11.5px;font-weight:700}
.vctag.ind{background:var(--panel);color:var(--ink-2);border:1px solid var(--line-2)}
.vctag.ch{background:var(--vc-soft,#eaf5fe);color:var(--vc,#0176d3)}
.vcexpand{align-self:flex-end;display:inline-flex;align-items:center;gap:7px;margin-top:8px;background:none;border:none;padding:2px 0;cursor:pointer;color:#1477cf;font-size:11.5px;font-weight:700;text-align:right}
.vcexpand .dnarrow{display:inline-flex;transition:transform .2s;filter:drop-shadow(0 1px 1px rgba(20,119,207,.35))}
.vcexpand .dnarrow svg{display:block}
.vcexpand:hover .expmsg{text-decoration:underline}
.vcexpand.open .dnarrow{transform:rotate(180deg)}
.vcproducts{margin-top:10px;padding-top:12px;border-top:1px dashed var(--line-2)}
.vcproducts[hidden]{display:none}
.vcproducts-h{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.prodwrap{display:flex;flex-wrap:wrap;gap:6px}
.prodpill{display:inline-flex;align-items:center;background:var(--pcs,#f0f3f7);border:1px solid var(--pc,#8a97a6);color:var(--pc,#3e4b5b);border-radius:11px;padding:4px 10px;font-size:11px;font-weight:700;text-decoration:none;transition:.12s}
.prodpill:hover{background:var(--pc,#0176d3);color:#fff}
.vcard.hide{display:none}
.vcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--vc,#0176d3);border-radius:12px;padding:22px 20px;text-align:left;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:7px;min-height:262px;transition:transform .15s,box-shadow .15s;position:relative}
.vcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.vcard .ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:var(--vc-soft,#eaf5fe);margin-bottom:6px}
.vcard h3{margin:0;font-size:24px;font-weight:800;line-height:1.08;color:#1a1a1a}
.vcard .usecase{font-size:15px;font-weight:700;color:var(--vc);margin:-1px 0 4px}
.vcard p{margin:0;font-size:13px;color:var(--ink-2);flex:1;line-height:1.5}
.vcard .go{font-weight:700;font-size:14px;color:var(--vc);display:flex;align-items:center;gap:6px;margin-top:6px}
.landing .foot{margin-top:44px;color:var(--faint);font-size:12.5px}
/* --- Gated intake form --- */
.intake{max-width:620px;margin:0 auto;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 26px 24px;box-shadow:var(--shadow-1)}
.intake .ihead{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px}
.intake .ihead h2{margin:0;font-size:18px;font-weight:800;color:#1a1a1a}
.intake .ihead .req{font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.intake .isub{font-size:12.5px;color:var(--faint);margin:0 0 18px}
.frow{margin:0 0 14px}
.frow.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.frow.two>div{margin:0}
.flabel{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin:0 0 6px}
.flabel .star{color:#c0392b;margin-left:2px}
.fin{width:100%;height:44px;border:1.5px solid var(--line-2);border-radius:8px;padding:0 13px;font-size:14.5px;color:var(--ink);background:#fff;box-shadow:var(--shadow-1)}
.fin:focus{outline:none;border-color:var(--brand-1);box-shadow:0 0 0 3px var(--guide-soft)}
.fin.miss{border-color:#e6b0a8}
.fhex{display:flex;align-items:center;gap:10px}
.fhex .sw{width:38px;height:38px;border-radius:8px;border:1px solid var(--line-2);background:var(--org-accent,#5b2bb3);flex:none}
.fhex .fin{font-family:Consolas,monospace;text-transform:uppercase}
.fhint{font-size:11.5px;color:var(--faint);margin-top:6px}
.fin.bad{border-color:#c0392b;box-shadow:0 0 0 3px rgba(192,57,43,.12)}
.fhint.bad{color:#c0392b}
.oppcheck{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:9px;background:var(--surface-2,#f7fafc);cursor:pointer;user-select:none;margin:4px 0 0}
.oppcheck input{width:17px;height:17px;accent-color:var(--brand-1);cursor:pointer}
.oppcheck span{font-size:13.5px;font-weight:700;color:var(--ink)}
.oppfields{margin-top:14px;padding-top:16px;border-top:1px dashed var(--line-2)}
.oppfields[hidden]{display:none}
.cards.locked .vcard{opacity:.42;filter:grayscale(.55);pointer-events:none;cursor:not-allowed}
.cards.locked .vcard:hover{transform:none;box-shadow:var(--shadow-1)}
.cards.locked .vcard .vcexpand,.cards.locked .vcard .vcproducts{pointer-events:auto}
.cards.locked .vcard.expanded{opacity:.72;filter:grayscale(.2)}
.lockmsg{text-align:center;font-size:13px;font-weight:700;color:var(--faint);margin:22px 0 -6px}
.cards.locked+.lockmsg{color:#0b7fd4}

/* ============================================================
   MONITOR (Act 1)
   ============================================================ */
.pad{padding:16px 18px}
.panel-title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:#0c1622;margin:0 0 4px}
.panel-title .bot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#032d60,#0176d3);color:#fff;display:grid;place-items:center;font-size:15px}
.actbanner{background:var(--info-bg);border:1px solid #cfe6fb;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink-2);margin:10px 0 16px}
.actbanner b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;min-height:76px}
.tile.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--guide-soft);position:relative}
.tile.sel::after{content:"✓";position:absolute;top:8px;right:10px;color:var(--brand);font-weight:800;font-size:12px}
.tile .n{font-size:25px;font-weight:800;color:#0c1622}
.tile .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.mrow{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mrow .head,.mrow .r{display:grid;grid-template-columns:2.2fr .8fr 2.6fr .7fr;gap:12px;padding:12px 16px;align-items:center;font-size:13px}
.mrow .head{background:#fafbfc;border-bottom:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mrow .r .name{font-weight:600}.mrow .r .sum{color:var(--ink-2);font-size:12.5px}.mrow .r .sum b{color:var(--ink)}
.link-act{color:var(--brand);font-weight:700;justify-self:start;display:inline-block;padding:2px 6px}

.dock{position:fixed;right:20px;bottom:134px;width:432px;max-width:calc(100vw - 40px);background:#fff;border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-2);z-index:40;overflow:hidden;display:flex;flex-direction:column;max-height:64vh}
.dock .dh{padding:11px 14px;display:flex;align-items:center;gap:9px;border-bottom:2px solid var(--brand-1)}
.dock .dh .dh-ic{color:var(--brand);font-size:15px}
.dock .dh .t{font-weight:700;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2b3a4a}
.dock .dh .dh-ctrls{color:var(--faint);font-size:13px;letter-spacing:3px}
.dacts{display:flex;border-bottom:1px solid var(--line)}
.dact{flex:1;height:42px;border:none;background:#fff;font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:7px;border-bottom:2px solid transparent}
.dact.primary{color:var(--brand);border-bottom-color:var(--brand)}
.dbody{padding:12px 14px;overflow:auto;background:#fff}
.catchup{background:#eef0f3;border-radius:10px;padding:12px;display:flex;gap:10px;margin-bottom:14px;max-height:158px;overflow:auto}
.catchup .cu-main{flex:1;min-width:0}
.catchup .cu-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.catchup .cu-title{font-weight:800;font-size:13.5px;color:#2b3a4a}
.catchup .cu-dismiss{color:var(--brand);font-weight:600;font-size:12.5px;cursor:pointer}
.catchup .cu-p{font-size:12.5px;color:#3e4b5b;margin:0 0 8px;line-height:1.45}
.catchup .cu-issue-h{font-weight:800;font-size:12.5px;color:#2b3a4a;margin-bottom:2px}
.flagline{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}

.bubbles{display:flex;flex-direction:column;gap:9px}
.b{max-width:82%;padding:9px 12px;border-radius:13px;font-size:12.5px;line-height:1.4}
.b .who{font-size:10px;color:var(--faint);margin-top:5px}
.b.them{align-self:flex-start;background:#eef1f5;color:var(--ink)}
.b.ai{align-self:flex-end;background:#48566a;color:#fff}
.b.ai .who{color:#c7cfda;text-align:right}
.b.sys{align-self:center;background:#fff;border:1px dashed var(--line-2);color:var(--muted);font-size:11px;max-width:94%;text-align:center}
.b.appear{animation:pop .32s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============================================================
   VOICE CALL (Act 2)
   ============================================================ */
.voicetop{background:#fff;border-bottom:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;gap:22px}
.voicetop .vt-ic{width:34px;height:34px;border-radius:8px;background:var(--good-bg);color:var(--good);display:grid;place-items:center;font-size:16px}
.voicetop .vt-t{font-weight:800;font-size:15px}.voicetop .vt-t small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.voicetop .vt-meta{display:flex;gap:22px}
.voicetop .vt-meta .k{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.voicetop .vt-meta .v{font-size:12.5px;font-weight:600;margin-top:2px}
.voicetop .vt-btns{margin-left:auto;display:flex;gap:8px}
.voicetop .vt-btns button{height:30px;border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:0 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}

.ws{display:grid;grid-template-columns:378px 1fr 396px;gap:12px;padding:12px 14px;align-items:start}
@media(max-width:1240px){.ws{grid-template-columns:340px 1fr}.ws .rail{grid-column:1/-1}}
@media(max-width:900px){.ws{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-1)}
.card .ch{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px}
.card .cb{padding:14px}

.idcard{border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-1)}
.idcard .top{background:linear-gradient(115deg,var(--org-accent,#5b2bb3),#7b3ff0 52%,#0176d3);padding:15px;display:flex;gap:13px;align-items:center;position:relative}
.idcard .ava{width:54px;height:54px;border-radius:50%;background:#fff;color:#5b2bb3;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.22)}
.idcard .who h2{margin:0;color:#fff;font-size:18px;font-weight:800}
.idcard .who .loc{color:#e9ddff;font-size:12px;margin-top:2px}
.tags{display:flex;gap:6px;margin-top:6px}
.tag{background:rgba(255,255,255,.24);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:5px}
.health{position:absolute;top:12px;right:12px;background:#fff;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--good);display:flex;align-items:center;gap:5px}
.idcard .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.kvi .k{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kvi .v{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:2px}
.csat{padding:0 14px 14px}
.csat .lbl{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.csat .lgd{display:flex;gap:10px;font-size:10px;color:var(--muted)}
.csat .lgd i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px}
.csat svg{width:100%;height:64px;display:block}

.phone .cb{display:flex;flex-direction:column;gap:12px}
.phone .status{display:flex;align-items:center;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:14px}
.pill.live{background:var(--good-bg);color:var(--good)}.pill.ended{background:var(--panel);color:var(--muted)}
.phone .num{font-size:16px;font-weight:700}.phone .num small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.phone .timer{font-size:15px;font-weight:800;color:var(--bad);display:flex;align-items:center;gap:6px}
.phone .timer .rd{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.phone .ctrls{display:flex;gap:8px}
.pc{flex:1;height:38px;border:1px solid var(--line-2);background:#fff;border-radius:8px;color:var(--ink-2);font-size:13px;font-weight:600;display:grid;place-items:center}
.pc.end{background:var(--pink);color:#fff;border-color:var(--pink);flex:1.5}

.convo{max-height:330px;overflow:auto;padding:12px 14px}
/* once the live call is under way the transcript expands to fill the workspace, reaching down to the Cases card */
.convo.tall{min-height:560px;max-height:calc(100vh - 240px)}
.convo .lead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:10px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:blink 1s infinite}
.rb{margin-bottom:11px;display:flex;flex-direction:column}
.rb .bub{max-width:85%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.4}
.rb.rep{align-items:flex-end}.rb.cust{align-items:flex-start}
.rb.rep .bub{background:#63676e;color:#fff}
.rb.cust .bub{background:#e9ecf0;color:var(--ink);border:1px solid var(--line-2)}
.convo .lead .convo-ic{display:inline-flex;flex:none}
.convo .lead .convo-ic svg{width:22px;height:22px;display:block}
.rb .ts{font-size:10px;color:var(--faint);margin-top:4px}
.rb.appear{animation:pop .3s ease both}

/* center tabs + cards */
.wtabs{display:flex;gap:18px;border-bottom:1px solid var(--line);padding:0 14px}
.wtab{padding:11px 2px;font-size:13.5px;color:var(--ink-2);border-bottom:2px solid transparent;font-weight:600;white-space:nowrap}
.wtab.active{color:var(--brand);border-bottom-color:var(--brand)}
.scard{border:1px solid var(--line);border-radius:11px;margin:12px 14px 0;overflow:hidden}
.scard .sc-h{padding:10px 13px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);background:#fcfdfe}
.caseitem{padding:10px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
.caseitem:last-child{border-bottom:0}
.caseitem a{font-weight:700}.caseitem .meta{color:var(--muted);font-size:11.5px;margin-top:2px}
.kvrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 13px}
.kvrow .k{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kvrow .v{font-size:12.5px;font-weight:600;margin-top:2px}
.desc{padding:0 13px 13px;font-size:12px;color:var(--ink-2)}
.senti{padding:10px 13px}
.senti svg{width:100%;height:90px;display:block}
.senti .lgd{display:flex;gap:12px;font-size:10px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.senti .lgd i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}

/* coaching scorecard */
.scorecard{margin:12px 14px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.scorecard .sh{background:linear-gradient(120deg,#5b2bb3,#0176d3);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between}
.scorecard .sh .big{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid #fff;display:grid;place-items:center;font-size:21px;font-weight:800}
.scorecard .sh .tt{font-size:15px;font-weight:800}
.scorecard .sh .badges{display:flex;gap:6px;margin-top:6px}
.scorecard .sh .badges span{background:rgba(255,255,255,.22);font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px}
.scorecard .desc2{padding:14px;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.rubric{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.rub .rl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700}
.rub .bar{height:7px;border-radius:4px;background:var(--panel);margin:5px 0;overflow:hidden}
.rub .bar i{display:block;height:100%;border-radius:4px}
.rub .note{font-size:11px;color:var(--muted);font-style:italic}
.tone-good i{background:var(--good)}.tone-coach i{background:#e6a817}.tone-bad i{background:var(--bad)}
/* coaching extra sections */
.csec{border-top:1px solid var(--line);padding:14px 16px}
.csec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-bottom:11px}
.softskills{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.softskills{grid-template-columns:repeat(2,1fr)}}
.ss{background:var(--panel);border-radius:10px;padding:13px 8px;text-align:center}
.ss .ic{width:34px;height:34px;border-radius:50%;background:#eef0f3;display:grid;place-items:center;margin:0 auto 8px;font-size:15px}
.ss .nm{font-size:12.5px;color:var(--ink-2);margin-bottom:5px}
.ss .lv{font-size:12px;font-weight:800;letter-spacing:.03em}
.ss .lv.strong{color:var(--good)}.ss .lv.adequate{color:#c98a17}
.concern{background:var(--panel);border-left:3px solid var(--good);border-radius:8px;padding:12px 14px}
.concern .st{color:var(--good);font-weight:800;font-size:11.5px;letter-spacing:.05em}
.concern .st::before{content:"✓ "}
.concern .tt{font-weight:700;font-size:13px;margin:5px 0 4px}
.concern .rp{font-size:12px;color:var(--ink-2)}.concern .rp b{color:var(--ink)}
.moment{display:flex;gap:11px}
.moment .dot{width:12px;height:12px;border-radius:50%;background:#7b3ff0;margin-top:4px;flex:none}
.moment .tm{color:#7b3ff0;font-weight:800;font-size:12px}
.moment .tt{font-weight:700;font-size:13px;margin:2px 0}
.moment .sub{font-size:12px;color:var(--muted)}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:640px){.trow{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#eef0fb;color:#4a4fb0;font-size:12px;font-weight:600;padding:5px 11px;border-radius:14px}
.just{font-size:12.5px;color:var(--ink-2);line-height:1.55}
/* editable Automated Wrap-Up */
.wu-head{display:flex;align-items:center;gap:9px;padding:12px 14px;font-weight:800;font-size:15px;border-bottom:1px solid var(--line)}
.wu-ic{width:30px;height:30px;border-radius:50%;background:#c8106b;display:grid;place-items:center;flex:none}
.wu-ic svg{width:18px;height:18px;display:block}
.wu-i{margin-left:auto;color:var(--brand);font-size:14px}
.wu-recwrap{padding:12px 14px}
.getrec-ic{width:20px;height:20px;display:block;flex:none}
.wu-body{background:#fff;padding:0 14px;display:flex;flex-direction:column}
.wu-field{padding:13px 0;border-top:1px solid var(--line)}
.wu-field:first-child{border-top:0}
.wu-fh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:5px}
.wu-field label{font-size:13.5px;font-weight:800;color:var(--ink)}
.wu-edit{background:none;border:0;padding:0;cursor:pointer;flex:none}
.wu-edit svg{width:17px;height:17px;display:block}
.wu-text{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.wu-foot{padding:12px 14px}
.wu-thumbs{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2);margin-bottom:13px}
.wu-thumbs .tb{cursor:pointer;font-size:15px}
.wu-btns{display:flex;justify-content:center;gap:12px}
.wu-cancel{border:1px solid var(--line-2);background:#fff;color:var(--good);border-radius:20px;padding:8px 22px;font-weight:700;font-size:13px}
.wu-save{border:1px solid var(--good);background:var(--good);color:#fff;border-radius:20px;padding:8px 28px;font-weight:800;font-size:13px}
/* top-strip call-ended pill */
.vt-ended{display:flex;align-items:center;gap:8px}
.vt-ended .pill-red{background:var(--pink);color:#fff;font-weight:800;font-size:12px;padding:5px 13px;border-radius:16px}
.vt-ended .dur{color:var(--bad);font-weight:800;font-size:13px}

/* ============================================================
   Service Assistant (right rail)
   ============================================================ */
.sra{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-1);overflow:hidden}
.sra .h{padding:12px 14px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.sra-hero{margin:12px 14px 0;border-radius:12px;background:#EEF1F5;padding:16px 14px;position:relative;overflow:hidden}
.sra-hero .astro{position:absolute;right:6px;top:6px;width:70px;height:70px;filter:drop-shadow(0 4px 7px rgba(0,0,0,.18));animation:float 4s ease-in-out infinite}
.sra-hero .astro svg{width:100%;height:100%;display:block}
@keyframes float{50%{transform:translateY(-7px)}}
.sra-hero .spark{position:absolute;color:#fff;opacity:.8}
.sra-hero p{margin:0;font-size:12px;color:var(--ink-2);max-width:none}
.sra-hero b{color:var(--ink)}
.grem{filter:grayscale(1);opacity:.85}
.reveal{padding:12px 14px;border-top:1px solid var(--line);animation:pop .35s ease both}
/* Service Assistant: fixed-height panel, internal scroll so the page stays put */
.sra.assist{display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.sra.assist>.h{flex:none}
.sra-scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding-bottom:12px;min-width:0}
.sra-scroll .reveal,.sra-scroll .planwrap{min-width:0;overflow-wrap:anywhere}
.planwrap{border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin:12px 14px 0;background:#EEF1F5}
.planwrap .pt{font-weight:800;font-size:15px;margin:5px 0 6px}
.planwrap .body{font-size:12.5px;color:var(--ink-2);margin:0 0 8px;line-height:1.45}
.planwrap .body.dim{color:var(--muted)}
.planwrap .rec{margin:6px 0 10px;padding-left:18px}
.planwrap .rec li{font-size:12px;color:var(--ink-2);margin:5px 0}
.thumbs{display:flex;gap:8px;margin:2px 0 10px}
.thumbs span{width:32px;height:28px;border:1px solid var(--line-2);border-radius:6px;display:grid;place-items:center;font-size:14px;cursor:pointer}
.plan .it .txt{flex:1}
.plan .it .src{color:var(--brand);font-weight:800;font-size:10.5px;cursor:pointer;vertical-align:super;margin-left:2px}
.kb .planwrap .kb-title{margin:4px 0 2px}
.kb .planwrap ol{margin:6px 0 10px;padding-left:18px}
.kb .planwrap ol li{margin:6px 0;font-size:12px;color:var(--ink-2);line-height:1.45}
.kb-btns{display:flex;gap:8px}
.kbbtn{flex:1;height:36px;border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;font-weight:700;font-size:12.5px;cursor:pointer}
/* left-column list cards: white + full column width to match the id/phone cards above */
.scard.wcard{margin:0;background:#fff;border-radius:12px;box-shadow:var(--shadow-1)}
.emptytab{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}
.lbl{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;color:var(--ink);margin-bottom:7px}
.lbl .ic{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#032d60,#0176d3);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.lbl.k .ic{background:linear-gradient(135deg,#7b2fd6,#b45cf0)}
.lbl.wk .ic{background:linear-gradient(135deg,#0a7d3c,#2e844a)}
.sra p.body{margin:0 0 8px;font-size:12.5px;color:var(--ink-2)}
.act{width:100%;height:36px;border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;font-weight:700;font-size:12.5px;margin-top:4px}
.act.solid{background:var(--good);border-color:var(--good);color:#fff}
.act.run{background:linear-gradient(120deg,#c9d4ff,#e3d3ff 55%,#cdeeff);border:1px solid #cdc6ef;color:#37275f;font-weight:800}
.planbox{border:1px solid var(--line);border-radius:9px;padding:11px;margin-top:2px}
.planbox .pt{font-weight:800;font-size:12px;margin-bottom:5px}
.planbox ul{margin:6px 0 0;padding-left:16px}
.planbox li{font-size:12px;color:var(--ink-2);margin:4px 0}

/* spotlight */
.guided{position:relative;box-shadow:0 0 0 3px var(--guide),0 0 0 7px var(--guide-soft) !important;border-radius:10px;z-index:5;animation:ring 1.7s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 3px var(--guide),0 0 0 7px var(--guide-soft)}50%{box-shadow:0 0 0 3px var(--guide),0 0 0 11px rgba(var(--guide-rgb),.05)}}
.guided::after{content:"";position:absolute;top:-9px;right:-9px;width:16px;height:16px;border-radius:50%;background:var(--guide);box-shadow:0 0 0 4px rgba(var(--guide-rgb),.28);animation:pulse 1.4s ease-out infinite;z-index:6}
.guided.no-pulse::after{display:none}
/* Dock action buttons sit flush to the panel edges inside .dock{overflow:hidden};
   use an inset ring so the highlight hugs the button and never clips or overlaps its neighbor. */
.dacts .dact.guided{box-shadow:inset 0 0 0 2.5px var(--guide) !important;border-radius:8px;animation:none}
.afvhist{margin-bottom:12px}
.convo .vcatch{margin-bottom:12px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--guide-rgb),.5)}70%{box-shadow:0 0 0 12px rgba(var(--guide-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--guide-rgb),0)}}
/* When a full-bleed .reveal row is guided, ring the inner .planwrap card so the glow
   doesn't overlap the hero/row above. The wrapper carries no ring or dot of its own. */
.reveal.guided{box-shadow:none !important;animation:none;border-radius:0}
.reveal.guided::after{display:none}
.reveal.guided .planwrap{box-shadow:0 0 0 3px var(--guide),0 0 0 7px var(--guide-soft);border-radius:10px;position:relative;z-index:5;animation:ring 1.7s ease-in-out infinite}
.reveal.guided .planwrap::after{content:"";position:absolute;top:-9px;right:-9px;width:16px;height:16px;border-radius:50%;background:var(--guide);box-shadow:0 0 0 4px rgba(var(--guide-rgb),.28);animation:pulse 1.4s ease-out infinite;z-index:6}
.clickable{cursor:pointer}
/* rectangular box highlight (e.g. a column header or a whole component) */
.boxed{outline:2.5px solid var(--guide);outline-offset:3px;border-radius:3px;position:relative;z-index:4;animation:boxpulse 1.7s ease-in-out infinite}
@keyframes boxpulse{0%,100%{outline-color:var(--guide)}50%{outline-color:rgba(var(--guide-rgb),.4)}}

/* guidance bar */
.guidebar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line-2);box-shadow:0 -6px 24px rgba(16,32,50,.10);display:flex;align-items:center;gap:16px;padding:12px 18px;min-height:100px}

.guidebar .dothis{font-size:12.5px;color:var(--brand);font-weight:700;margin-top:4px;display:flex;align-items:center;gap:6px}
.guidebar .dothis::before{content:"➤";font-size:9px}
.gctrls{display:flex;align-items:center;gap:8px}
.gbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);font-size:16px;display:grid;place-items:center}
.gbtn:hover{border-color:var(--brand-1);color:var(--brand)}
.gbtn.play{width:auto;padding:0 18px;gap:8px;display:flex;align-items:center;background:var(--brand);color:#fff;border-color:var(--brand);font-weight:800;font-size:14px}
.gbtn:disabled{opacity:.4;cursor:not-allowed}
.gcount{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;margin-left:4px}
.gcol{font-size:15px;line-height:1}
.guidebar.collapsed{min-height:0;padding:8px 18px;justify-content:flex-end}
.guidebar.collapsed .gtxt,.guidebar.collapsed #ttToggle,.guidebar.collapsed #auToggle{display:none}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap;cursor:pointer}
.sw{width:38px;height:22px;border-radius:12px;background:var(--line-2);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on .sw{background:var(--brand)}.toggle.on .sw::after{left:18px}
.progline{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--brand-1),var(--brand));transition:width .3s}
.talk-off .talk,.talk-off .dothis{filter:blur(4px);opacity:.35;user-select:none}

.toast{position:fixed;left:50%;bottom:124px;transform:translateX(-50%) translateY(20px);background:#0c1622;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:80;opacity:0;transition:.25s;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ok{color:#6ee79a}
.reduced *{animation:none !important;transition:none !important}

/* ---------- ORG branding (name + brand hex) ---------- */
const ORG={name:"",hex:""};
function normHex(v){ if(!v)return""; let s=String(v).trim().replace(/^#/,'');
  if(/^[0-9a-fA-F]{6}$/.test(s))return '#'+s.toLowerCase();
  if(/^[0-9a-fA-F]{3}$/.test(s))return '#'+s.split('').map(c=>c+c).join('').toLowerCase();
  return ""; }

/* The spotlight (ring, pulsing dot, boxed outline) is tinted from the brand hex typed on
   the sign-on placemat, so "where to look" is always the customer's colour. Leave the hex
   blank and it stays the default Salesforce blue. */
const GUIDE_DEFAULT={css:"#1b96ff",rgb:"27,150,255"};
function hexToRgb(h){ const s=normHex(h); if(!s)return null;
  return {r:parseInt(s.slice(1,3),16),g:parseInt(s.slice(3,5),16),b:parseInt(s.slice(5,7),16)}; }
function relLum(c){ const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};
  return .2126*f(c.r)+.7152*f(c.g)+.0722*f(c.b); }
/* The console is white, so a pale brand colour (yellow, mint, pastel) would give an
   invisible ring. Darken until the colour carries against #fff, preserving its hue. */
function guideFromBrand(hex){ const c=hexToRgb(hex); if(!c) return GUIDE_DEFAULT;
  let {r,g,b}=c, guard=0;
  while(relLum({r,g,b})>0.45 && guard++<30){ r=Math.round(r*.9); g=Math.round(g*.9); b=Math.round(b*.9); }
  return {css:`rgb(${r},${g},${b})`, rgb:`${r},${g},${b}`}; }

function applyOrg(){ document.getElementById('orgName').textContent=ORG.name||"Vireo Financial";
  const rs=document.documentElement.style;
  rs.setProperty('--org-accent', normHex(ORG.hex)||"#5b2bb3");
  const g=guideFromBrand(ORG.hex);
  rs.setProperty('--guide', g.css);
  rs.setProperty('--guide-rgb', g.rgb); }

/* ---------- Transcript audio (optional; off by default) ----------
   Speaks each newly revealed transcript turn during the Act 2 voice call.

   A turn may carry its own recording, which always wins. Written with a space
   after the key so build-artifact.js's inliner doesn't treat this example as a
   real reference:
       audio: "audio/wealth/agent-1.mp3"    — file beside index.html (Pages)
       audio: "data:audio/mpeg;base64,…"    — inlined; required by the artifact
   With no `audio` key the browser's speech synthesiser reads `t`, so the audio
   regenerates itself whenever you edit transcript copy — nothing to re-record.

   Audio never blocks the demo. If it is off, unsupported, blocked by autoplay
   policy, or the clip 404s, playback resolves and autoplay falls back to the
   step's `dur`. Every wait is capped so a dropped 'end' event can't freeze the
   run. Default is OFF: an AE opening this in an open office should not have it
   start talking. */
const AUDIO_PREF='a4s.audio';
const AUDIO={on:false, token:0, voices:{rep:null,customer:null}, el:null, keep:null};

function audioSupported(){ try{
  return typeof speechSynthesis!=='undefined' && typeof SpeechSynthesisUtterance!=='undefined';
}catch(e){ return false; } }

/* Voice inventory is OS/browser dependent, so pick by preference with fallbacks
   rather than by name. Two distinct voices keeps rep and customer apart. */
function pickVoices(){
  if(!audioSupported()) return;
  let vs=[]; try{ vs=speechSynthesis.getVoices()||[]; }catch(e){ return; }
  if(!vs.length) return;                       // Chrome populates this async
  const en=vs.filter(v=>/^en\b|^en[-_]/i.test(v.lang||''));
  const pool=en.length?en:vs;
  AUDIO.voices.rep=pool[0]||null;
  AUDIO.voices.customer=pool.find(v=>v!==AUDIO.voices.rep)||AUDIO.voices.rep;
}

/* Chrome silently stops synthesis after ~15s. A periodic resume keeps longer
   turns from being cut off mid-sentence; it is a no-op when nothing is speaking. */
function startKeepAlive(){ stopKeepAlive();
  AUDIO.keep=setInterval(()=>{ try{
    if(speechSynthesis.speaking && !speechSynthesis.paused){ speechSynthesis.pause(); speechSynthesis.resume(); }
  }catch(e){} }, 9000); }
function stopKeepAlive(){ if(AUDIO.keep){ clearInterval(AUDIO.keep); AUDIO.keep=null; } }

/* Invalidates every in-flight callback via the token, so a step change mid-
   sentence can never advance the demo or leave two voices overlapping. */
function cancelAudio(){
  AUDIO.token++;
  try{ speechSynthesis.cancel(); }catch(e){}
  if(AUDIO.el){ try{ AUDIO.el.pause(); AUDIO.el.removeAttribute('src'); }catch(e){} AUDIO.el=null; }
}

function speakTurn(turn, token, finish){
  if(!audioSupported() || token!==AUDIO.token) return finish();
  try{
    const u=new SpeechSynthesisUtterance(String(turn.t||''));
    const v=turn.who==='rep'?AUDIO.voices.rep:AUDIO.voices.customer;
    if(v){ u.voice=v; u.lang=v.lang||'en-US'; }
    u.rate=1.02; u.pitch=turn.who==='rep'?1.0:0.94;
    u.onend=finish; u.onerror=finish;
    speechSynthesis.speak(u);
  }catch(e){ finish(); }
}

function playTurn(turn, token){
  return new Promise(resolve=>{
    if(token!==AUDIO.token) return resolve();
    let done=false;
    const finish=()=>{ if(done)return; done=true; clearTimeout(guard); resolve(); };
    // Upper bound on the wait: roughly 13 chars/sec, doubled, plus slack.
    const est=1500+(String(turn.t||'').length/13)*1000;
    const guard=setTimeout(finish, Math.min(45000, est*2+2000));
    if(turn.audio){
      try{
        const el=new Audio(turn.audio); AUDIO.el=el;
        el.onended=finish;
        el.onerror=()=>speakTurn(turn, token, finish);   // missing clip → speak it
        const p=el.play();
        if(p && p.catch) p.catch(()=>speakTurn(turn, token, finish));
        return;
      }catch(e){ /* fall through to synthesis */ }
    }
    speakTurn(turn, token, finish);
  });
}

async function playTurns(turns){
  const token=AUDIO.token;
  for(const t of turns){
    if(token!==AUDIO.token) return;               // navigated away mid-sequence
    await playTurn(t, token);
  }
}

/* Set by render() to a promise that settles when this step's turns finish
   speaking; tick() waits on it instead of the fixed `dur`. */
let audioWait=null;
function speakForStep(prevTurns, nowTurns){
  audioWait=null;
  if(!AUDIO.on || !(nowTurns>prevTurns)) return;
  const all=V&&V.repConvo&&V.repConvo.turns;
  if(!all||!all.length) return;
  const fresh=all.slice(prevTurns, nowTurns).filter(Boolean);
  if(!fresh.length) return;
  audioWait=playTurns(fresh);
}

const SESSION_ID = (()=>{ try{ return (crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2); }catch(e){ return String(Date.now()); } })();
function track(event, extra){
  if(!TRACK_URL) return;              // tracking disabled — safe no-op
  const payload = Object.assign({
    ts:new Date().toISOString(), sessionId:SESSION_ID, event,

  }, extra||{});
  try{
    const body = JSON.stringify(payload);

    else{ fetch(TRACK_URL,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain;charset=UTF-8"},body}); }
  }catch(e){/* never let tracking break the demo */}
}

let idx=0,playing=false,timer=null,talkTrack=true;
let _lastTrackedStep=-1, _fired={};   // usage-tracking de-dupe (per demo run)
const $=s=>document.querySelector(s);
function trackMilestones(step,f){
  if(step.view==="landing") return;               // no telemetry on the placemat
  const total=STEPS.length;
  if(idx!==_lastTrackedStep){
    _lastTrackedStep=idx;
    track('step_viewed',{ step:idx+1, total, stepTitle:step.title, view:step.view, pct:Math.round(idx/(total-1)*100) });
  }
  if(f.emailSent && !_fired.call_ended){ _fired.call_ended=1; track('call_ended',{ step:idx+1 }); }
  if(f.caseClosed && !_fired.case_closed){ _fired.case_closed=1; track('case_closed',{ caseNumber:V.caseData.number }); }
  if(idx===total-1 && !_fired.demo_completed){ _fired.demo_completed=1; track('demo_completed',{ total }); }
}
function foldState(i){ const st={flags:{},turns:0,view:"landing"};
  for(let k=0;k<=i;k++){const s=STEPS[k]; if(s.view)st.view=s.view;
    if(typeof s.turns==="number")st.turns=Math.max(st.turns,s.turns); if(s.set)Object.assign(st.flags,s.set);}
  return st; }
function render(){
  const step=STEPS[idx],st=foldState(idx),f=st.flags,v=step.view;
  $('#gh').hidden=!f.gh; $('#omnirail').hidden=!f.gh; $('#navtabs').hidden=(v!=="monitor");
  const consoleTabs=(v==="voice"||v==="case");   // Case + Voice sit adjacent whenever a live call/case is open
  const primaryViews=(v==="monitor"||v==="home"||v==="ask");
  $('#tabPrimary').hidden=!primaryViews;
  $('#tabPrimary').textContent = v==="home"?"Home" : v==="ask"?"✦ Ask: Home" : "Command Center for Service";
  $('#tabCase').hidden=!consoleTabs; $('#tabVoice').hidden=!consoleTabs;
  $('#tabCase').innerHTML=`${V.caseData.number} <span class="chev">⌄</span> <span class="close">✕</span>`;
  $('#tabVoice').textContent=V.monitor.voiceCallId;
  $('#tabPrimary').classList.toggle('active', primaryViews);
  $('#tabCase').classList.toggle('active', v==="case");
  $('#tabVoice').classList.toggle('active', v==="voice");
  if(f.bell) addNotif('score',`Service Quality Scorecard: ${V.callSummary.score}/100`,'Call scored — sent to supervisor','📊'); else removeNotif('score');
  if(f.kbSaved) addNotif('kb','Knowledge article ready for review','Drafted from case '+V.caseData.number,'📄'); else removeNotif('kb');
  const stage=$('#stage');
  if(stage.dataset.view!==st.view){ stage.dataset.view=st.view; stage.innerHTML=renderView(st.view);
    if(st.view==="landing") bindLanding(); if(st.view==="voice") voiceTab="service"; }
  if(st.view==="ask") updateAsk(f);
  if(st.view==="monitor") updateMonitor(f);
  if(st.view==="voice"){ updateVoice(st,f); speakForStep(idx>0?foldState(idx-1).turns:0, st.turns); }
  else audioWait=null;
  if(st.view==="case") updateCase(f);
  $('#glabelText').textContent=`Guided demo · ${V.segment}`;
  $('#gTitle').textContent=step.title; $('#gTalk').textContent=step.talk;
  const doEl=$('#gDo'); if(step.dothis){doEl.hidden=false;doEl.textContent=step.dothis;}else doEl.hidden=true;
  $('#gCount').textContent=`${idx+1} / ${STEPS.length}`;
  $('#progline').style.width=`${idx/(STEPS.length-1)*100}%`;
  $('#btnBack').disabled=idx===0; $('#btnNext').disabled=idx===STEPS.length-1;
  $('#btnPlay').innerHTML=playing?'❚❚ Pause':'▶ Play';
  // guidance bar + spotlight only appear once you're inside the demonstration (not on the landing placemat)
  const onLanding=step.view==="landing";
  $('#guidebar').hidden=onLanding;
  $('#app').style.paddingBottom=onLanding?'0':'118px';
  if(onLanding) clearGuides();
  else applySpotlight(step);
  requestAnimationFrame(()=>{ const t=step.target&&$(step.target); if(!t) return;
    // if the target lives in a scrollable component (Service Assistant / transcript / dock), scroll THAT — keep the page still
    const sc=t.closest('.sra-scroll,.convo,.dbody');
    if(sc){ const cr=sc.getBoundingClientRect(),er=t.getBoundingClientRect(); sc.scrollTop += (er.top-cr.top)-24; }
    else if(t.scrollIntoView) t.scrollIntoView({behavior:'smooth',block:'center'}); });
  trackMilestones(step,f);
}
let spotEl=null;
function clearGuides(){
  if(spotEl){spotEl.classList.remove('guided','no-pulse');spotEl=null;}
  document.querySelectorAll('.clickable').forEach(e=>{e.classList.remove('clickable');e.onclick=null;});
  document.querySelectorAll('.boxed').forEach(e=>e.classList.remove('boxed'));
}
function applySpotlight(step){
  clearGuides();
  if(step.box){ (Array.isArray(step.box)?step.box:[step.box]).forEach(sel=>{const el=$(sel);if(el)el.classList.add('boxed');}); }
  if(step.target){ const el=$(step.target); if(el){ el.classList.add('guided'); if(step.noPulse)el.classList.add('no-pulse'); spotEl=el; } }
  if(step.advanceOn){const a=$(step.advanceOn); if(a){a.classList.add('clickable');a.onclick=(e)=>{e.stopPropagation();next();};}}
}
function go(i){cancelAudio();idx=Math.max(0,Math.min(STEPS.length-1,i));render();}
function next(){ if(idx<STEPS.length-1)go(idx+1); else stop(); }
function back(){pause();go(idx-1);}
const PLAY_DWELL=10000;   // continuous auto-advance: 10s per slide (or until spoken audio finishes)
function play(){ if(idx>=STEPS.length-1)return; playing=true; $('#btnPlay').innerHTML='❚❚ Pause'; tick(); }
function tick(){ clearTimeout(timer);
  // Runs continuously once started — advance every slide until the user pauses or we reach the end.
  const advance=()=>{ if(!playing) return; if(idx>=STEPS.length-1){stop();return;} go(idx+1); if(playing) tick(); };
  // With Voice audio on, wait for the longer of the spoken turn and the 10s dwell so speech is never cut.
  if(AUDIO.on && audioWait){ const w=audioWait, token=AUDIO.token; let aDone=false, tDone=false;
    const maybe=()=>{ if(aDone && tDone && playing) advance(); };
    w.then(()=>{ if(token!==AUDIO.token || !playing) return; aDone=true; maybe(); });
    timer=setTimeout(()=>{ tDone=true; maybe(); }, PLAY_DWELL);
    return; }
  timer=setTimeout(advance, PLAY_DWELL); }
function pause(){playing=false;clearTimeout(timer);cancelAudio();$('#btnPlay').innerHTML='▶ Play';}
function stop(){pause();}
function togglePlay(){playing?pause():play();}

function todayISO(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function viewLanding(){
  const meta=VMETA();
  const chip=c=>`${LAND_CH_ICON[c]||''} ${c}`;
  const indIcon=n=>(LAND_INDUSTRIES.find(i=>i.name===n)||{}).icon||'';
  const dnArrow=id=>`<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><defs><linearGradient id="dn-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7ff"/><stop offset=".55" stop-color="#2e9bee"/><stop offset="1" stop-color="#1477cf"/></linearGradient></defs><path fill="url(#dn-${id})" d="M12 2.2a2 2 0 0 0-2 2v8.3H7.3c-.94 0-1.4 1.14-.73 1.8l4.7 4.7c.4.4 1.06.4 1.46 0l4.7-4.7c.67-.66.21-1.8-.73-1.8H14V4.2a2 2 0 0 0-2-2z"/></svg>`;
  const card=m=>`<div class="vcard" id="card-${m.id}" data-ch="${m.channel}" data-ind="${m.industry}" style="--vc:${m.accent};--vc-soft:${m.accentSoft}">
    <div class="ic">${m.icon}</div>
    <h3>${m.segment}</h3>
    <div class="usecase">${m.useCase}</div>
    <p>${m.tagline}</p>
    <div class="vctags"><span class="vctag ind">${indIcon(m.industry)} ${m.industry}</span><span class="vctag ch">${chip(m.channel)}</span></div>
    <div class="go">Start Demo ›</div>
    <button class="vcexpand" data-exp="${m.id}" aria-label="Show products in this demo"><span class="dnarrow">${dnArrow(m.id)}</span><span class="expmsg">Click here for product information</span></button>
    <div class="vcproducts" id="prod-${m.id}" hidden>
      <div class="vcproducts-h">Products in this demonstration</div>
      <div class="prodwrap">${LAND_PRODUCTS.map(p=>`<a class="prodpill" href="${p.url}" target="_blank" rel="noopener noreferrer" style="--pc:${p.c};--pcs:${p.cs}">${p.name}</a>`).join('')}</div>
    </div></div>`;
  const cards=Object.values(meta).map(card).join('');
  const filterbar=`<div class="filterbar">
    <div class="filtergrp"><span class="filterlbl">Industry</span><div class="filterpills" id="indPills">${LAND_INDUSTRIES.map(i=>`<button class="filterpill" data-ind="${i.name}">${i.icon} ${i.name}</button>`).join('')}</div></div>
    <div class="filtergrp"><span class="filterlbl">Channel</span><div class="filterpills" id="chanPills">${LAND_CHANNELS.map(c=>`<button class="filterpill" data-ch="${c}">${chip(c)}</button>`).join('')}</div></div>
    <button class="chanclear" id="chanClear" hidden>Clear</button></div>`;
  if(!INTAKE.date) INTAKE.date = todayISO();
  return `<div class="landing-wrap"><div class="landing">
    <div class="sflogo">${sfCloud()}<span class="aflock">Agentforce <span class="afsub">for Financial Services</span></span></div>
    <span class="eyebrow-pill">Guided Interactive Demo</span>
    <h1>Pick your customer's <b>world.</b></h1>
    <div class="intake">
      <div class="ihead"><h2>Before you start</h2><span class="req">All fields required</span></div>
      <p class="isub">A few details so this run is tied to you and your account.</p>
      <div class="frow two">
        <div>
          <label class="flabel" for="inFull">Full Name<span class="star">*</span></label>
          <input id="inFull" class="fin" data-req placeholder="e.g. Jordan Rivera" autocomplete="off" value="${INTAKE.fullName||''}"/>
        </div>
        <div>
          <label class="flabel" for="inEmail">Salesforce Email<span class="star">*</span></label>
          <input id="inEmail" class="fin" type="email" data-req placeholder="rep@salesforce.com" autocomplete="off" value="${INTAKE.repEmail||''}"/>
          <div class="fhint" id="emailHint">Use your Salesforce rep's <b>@salesforce.com</b> email.</div>
        </div>
      </div>
      <div class="frow two">
        <div>
          <label class="flabel" for="inAcct">Account Name<span class="star">*</span></label>
          <input id="inAcct" class="fin" data-req placeholder="e.g. Vireo Financial" autocomplete="off" value="${INTAKE.accountName||ORG.name||''}"/>
          <div class="fhint">Also brands the workspace org for this session.</div>
        </div>
        <div>
          <label class="flabel" for="inDate">Date</label>
          <input id="inDate" class="fin" type="date" value="${INTAKE.date}"/>
        </div>
      </div>
      <div class="frow">
        <label class="flabel">Brand color <span style="color:var(--faint);font-weight:600">(optional)</span></label>
        <div class="fhex"><span class="sw"></span><input id="inHex" class="fin" placeholder="#0176D3" autocomplete="off" value="${ORG.hex||''}"/></div>
      </div>
      <label class="oppcheck"><input type="checkbox" id="inOpp" ${INTAKE.isOpportunity?'checked':''}/><span>Is this related to an opportunity?</span></label>
      <div class="oppfields" id="oppFields" ${INTAKE.isOpportunity?'':'hidden'}>
        <div class="frow">
          <label class="flabel" for="inOppName">Opportunity Name<span class="star">*</span></label>
          <input id="inOppName" class="fin" data-oreq placeholder="e.g. Vireo — Agentforce Service Expansion" autocomplete="off" value="${INTAKE.opportunityName||''}"/>
        </div>
        <div class="frow two">
          <div>
            <label class="flabel" for="inAmount">Amount<span class="star">*</span></label>
            <input id="inAmount" class="fin" type="number" min="0" step="1" data-oreq placeholder="e.g. 120000" value="${INTAKE.amount||''}"/>
          </div>
          <div>
            <label class="flabel" for="inOppLink">Opportunity Link<span class="star">*</span></label>
            <input id="inOppLink" class="fin" type="url" data-oreq placeholder="https://…lightning.force.com/…" autocomplete="off" value="${INTAKE.opportunityLink||''}"/>
          </div>
        </div>
      </div>
    </div>
    ${filterbar}
    <div class="cards locked" id="cardGrid">${cards}</div>
    <div class="lockmsg" id="lockMsg">Complete the form above to unlock the storylines.</div>
    <div class="foot">Fictional data · synthetic likenesses · no PII · not connected to a live org · for demonstration only.</div>
  </div></div>`;
}
function intakeValid(){
  if(!(INTAKE.fullName||'').trim()) return false;
  if(!SF_EMAIL_RE.test((INTAKE.repEmail||'').trim())) return false;
  if(!(INTAKE.accountName||'').trim()) return false;
  if(INTAKE.isOpportunity){
    if(!(INTAKE.opportunityName||'').trim()) return false;
    if(!String(INTAKE.amount||'').trim()) return false;
    if(!(INTAKE.opportunityLink||'').trim()) return false;
  }
  return true;
}
function refreshGate(){
  const grid=$('#cardGrid'), msg=$('#lockMsg'), ok=intakeValid();
  if(grid) grid.classList.toggle('locked', !ok);
  if(msg) msg.textContent = ok ? 'Storylines unlocked — pick one to begin.' : 'Complete the form above to unlock the storylines.';
}
function bindLanding(){
  const full=$('#inFull'), email=$('#inEmail'), emailHint=$('#emailHint'),
        date=$('#inDate'), acct=$('#inAcct'), hex=$('#inHex'),
        opp=$('#inOpp'), oppWrap=$('#oppFields'),
        oname=$('#inOppName'), amt=$('#inAmount'), olink=$('#inOppLink');
  if(full) full.addEventListener('input',e=>{ INTAKE.fullName=e.target.value; refreshGate(); });
  if(email) email.addEventListener('input',e=>{
    INTAKE.repEmail=e.target.value;
    const v=e.target.value.trim(), bad=v && !SF_EMAIL_RE.test(v);
    email.classList.toggle('bad', !!bad);
    if(emailHint){ emailHint.classList.toggle('bad', !!bad); emailHint.innerHTML = bad ? 'Must be a valid <b>@salesforce.com</b> email.' : "Use your Salesforce rep's <b>@salesforce.com</b> email."; }
    refreshGate();
  });
  if(date) date.addEventListener('input',e=>{ INTAKE.date=e.target.value; });
  if(acct) acct.addEventListener('input',e=>{ INTAKE.accountName=e.target.value; ORG.name=e.target.value; applyOrg(); refreshGate(); });
  if(hex)  hex.addEventListener('input',e=>{ ORG.hex=e.target.value; applyOrg(); });
  if(opp)  opp.addEventListener('change',e=>{ INTAKE.isOpportunity=e.target.checked; if(oppWrap) oppWrap.hidden=!e.target.checked; refreshGate(); });
  if(oname) oname.addEventListener('input',e=>{ INTAKE.opportunityName=e.target.value; refreshGate(); });
  if(amt)  amt.addEventListener('input',e=>{ INTAKE.amount=e.target.value; refreshGate(); });
  if(olink) olink.addEventListener('input',e=>{ INTAKE.opportunityLink=e.target.value; refreshGate(); });
  Object.values(VMETA()).forEach(m=>{const c=$('#card-'+m.id);if(!c)return;
    c.addEventListener('click',(e)=>{
      if(e.target.closest('.vcexpand')||e.target.closest('.vcproducts')) return;
      if(!intakeValid()){ toast('Please complete the form first.'); return; }
      if(!m.ready){ toast('That storyline is coming soon.'); return; }
      track('demo_started',{ vertical:m.id, useCase:m.useCase });
      selectVertical(m.id); go(1);
    });});
  // expand chevron — reveals the products list (works even while the cards are locked)
  document.querySelectorAll('#cardGrid .vcexpand').forEach(b=>b.addEventListener('click',(e)=>{
    e.stopPropagation();
    const id=b.dataset.exp, p=$('#prod-'+id), card=$('#card-'+id), open=p&&p.hasAttribute('hidden');
    if(p){ if(open) p.removeAttribute('hidden'); else p.setAttribute('hidden',''); }
    b.classList.toggle('open', !!open);
    if(card) card.classList.toggle('expanded', !!open);
  }));
  // filter pills — industry AND channel (multi-select within each dimension)
  const activeInd=new Set(), activeCh=new Set();
  function applyFilters(){
    Object.values(VMETA()).forEach(m=>{ const c=$('#card-'+m.id); if(!c)return;
      const okI=activeInd.size===0||activeInd.has(m.industry);
      const okC=activeCh.size===0||activeCh.has(m.channel);
      c.classList.toggle('hide', !(okI&&okC));
    });
    const cl=$('#chanClear'); if(cl) cl.hidden = activeInd.size===0 && activeCh.size===0;
  }
  document.querySelectorAll('#indPills .filterpill').forEach(p=>p.addEventListener('click',()=>{
    const v=p.dataset.ind;
    if(activeInd.has(v)){ activeInd.delete(v); p.classList.remove('on'); } else { activeInd.add(v); p.classList.add('on'); }
    applyFilters();
  }));
  document.querySelectorAll('#chanPills .filterpill').forEach(p=>p.addEventListener('click',()=>{
    const v=p.dataset.ch;

function updateCase(f){
  if(f.caseClassified){ const cls=V.caseData.classification||[];
    const pick=k=>{const m=cls.find(c=>c.k===k);return m?m.v:'';};
    const cl={clType:pick('Type'),clSub:pick('Reason')};
    Object.entries(cl).forEach(([id,v])=>{const el=$('#'+id); if(el)el.textContent=v;}); }
  const out=$('#caseSummaryOut');
  if(out){ out.hidden=!f.caseSummary; if(f.caseSummary&&!out.dataset.filled){out.dataset.filled="1";out.innerHTML=`<div class="out"><div class="gen">Generated · Prompt: Case Summarizer</div>${V.caseData.aiSummary}</div>`;} }
  const body=$('#casePlanBody'),close=$('#closePlanBtn'),draft=$('#draftPlanBtn');
  if(f.casePlan){ if(body){body.hidden=false;body.innerHTML=renderCasePlan(f.caseClosed);} if(close)close.hidden=false; if(draft)draft.textContent="✦ Redraft Plan"; }
  else{ if(body)body.hidden=true; if(close)close.hidden=true; }
  const spc=$('#servicePlanCard');if(spc)spc.classList.toggle('closed',!!f.caseClosed);
  const pw=$('#pWorking'),pc=$('#pClosed');
  const sv=$('#caseStatusVal');
  if(f.caseClosed){ if(pw){pw.className='pstep done';} if(pc){pc.className='pstep closed-hl';} if(close){close.textContent='✓ Case Closed';close.disabled=true;} if(sv)sv.textContent='Closed'; }
  else{ if(pw)pw.className='pstep done'; if(pc)pc.className='pstep'; if(sv)sv.textContent='Working'; }
  const slot=$('#outcomeSlot');if(slot)slot.innerHTML=f.outcomes?renderOutcome():'';
}
function renderCasePlan(closed){ const groups={}; V.caseData.planItems.forEach(it=>{(groups[it.g]=groups[it.g]||[]).push(it);});
  return `<div class="plan">`+Object.entries(groups).map(([g,items])=>`<div class="grp"><div class="gn">${g}</div>${items.map(it=>`<div class="it ${closed?'done':''}"><span class="ck">✓</span><span class="txt">${it.t}</span>${it.a?`<button class="ib" data-act="${it.a}">${it.a}</button>`:''}</div>`).join('')}</div>`).join('')+`</div>`; }
function renderOutcome(){ const o=V.outcomes;
  return `<div class="card" id="outcomeCard" style="margin-top:14px;border-color:var(--good)">
    <div class="ch" style="color:var(--good)">✓ ${o.headline}</div>
    <div class="cb" style="font-size:12.5px;color:var(--ink-2)">${o.detail}
      <div style="display:flex;gap:8px;margin-top:12px">${o.metrics.map(m=>`<div style="flex:1;background:var(--good-bg);border-radius:8px;padding:9px;text-align:center"><div style="font-weight:800;color:var(--good);font-size:12.5px">${m.v}</div><div style="font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">${m.l}</div></div>`).join('')}</div></div></div>`; }

function dashGauge(val,max){
  const cx=110,cy=112,r=80,sw=17;
  const pt=f=>[cx+r*Math.cos(Math.PI*(1-f)),cy-r*Math.sin(Math.PI*(1-f))];
  const seg=(a,b,col)=>{const p0=pt(a),p1=pt(b);const lg=(b-a)>0.5?1:0;return `<path d="M${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A ${r} ${r} 0 ${lg} 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="${sw}"/>`;};
  const vf=Math.max(0,Math.min(1,val/max));
  const na=Math.PI*(1-vf),nx=cx+(r-14)*Math.cos(na),ny=cy-(r-14)*Math.sin(na);
  const ticks=[0,20,40,60,80,100].map(t=>{const f=t/100,x=cx+(r+13)*Math.cos(Math.PI*(1-f)),y=cy-(r+13)*Math.sin(Math.PI*(1-f))+3;return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="9" fill="#98a3b1" text-anchor="middle">${t}</text>`;}).join('');
  const col=vf<0.34?'#c23934':vf<0.67?'#e08a00':'#1a7f5a';
  return `<svg viewBox="0 0 220 148" width="100%" style="max-height:150px">${seg(0,0.34,'#c23934')}${seg(0.34,0.67,'#f5a623')}${seg(0.67,1,'#1a7f5a')}${ticks}<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#0c1622" stroke-width="4" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" fill="#0c1622"/><text x="${cx}" y="${cy+34}" text-anchor="middle" font-size="26" font-weight="800" fill="${col}">${val}</text></svg>`;
}
function dashDonut(){
  const segs=[{v:75,c:'#7cc0f4',l:'Website'},{v:7,c:'#1b96ff',l:'SMS'},{v:7,c:'#9050e9',l:'Web'},{v:1,c:'#57b39b',l:'Other'}];
  const cx=90,cy=90,r=60,sw=27,C=2*Math.PI*r; let acc=0;
  const arcs=segs.map(s=>{const frac=s.v/90,dash=`${(frac*C).toFixed(1)} ${C.toFixed(1)}`,off=(-acc*C).toFixed(1);acc+=frac;return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${sw}" stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})"/>`;}).join('');
  const legend=segs.map(s=>`<div class="lg"><span class="lgsw" style="background:${s.c}"></span>${s.l}</div>`).join('');
  return `<div class="donutwrap"><svg viewBox="0 0 180 180" width="146">${arcs}<text x="90" y="99" text-anchor="middle" font-size="27" font-weight="800" fill="#0c1622">90</text></svg><div class="dlegend"><div class="lgh">Case Origin</div>${legend}</div></div>`;
}
function dashHBar(rows,max,ticks,labelW){
  const x0=labelW, w=300-x0, H=28, top=22; let y=top;
  const grid=ticks.map(t=>`<line x1="${(x0+t/max*w).toFixed(1)}" y1="16" x2="${(x0+t/max*w).toFixed(1)}" y2="${top+rows.length*(H+10)}" stroke="#eef1f5"/><text x="${(x0+t/max*w).toFixed(1)}" y="12" font-size="8.5" fill="#98a3b1" text-anchor="middle">${t}</text>`).join('');
  const bars=rows.map(r=>{const bw=r.v/max*w;const b=`<rect x="${x0}" y="${y}" width="${bw.toFixed(1)}" height="${H}" fill="${r.c||'#1b96ff'}"/>${r.v?`<text x="${(x0+bw-5).toFixed(1)}" y="${y+H/2+4}" font-size="11" fill="#fff" text-anchor="end" font-weight="700">${r.v}</text>`:''}${r.l?`<text x="${x0-6}" y="${y+H/2+4}" font-size="9.5" fill="#3e4b5b" text-anchor="end">${r.l}</text>`:''}`;y+=H+10;return b;}).join('');
  return `<svg viewBox="0 0 300 ${top+rows.length*(H+10)+6}" width="100%">${grid}${bars}</svg>`;
}

  if(g)g.hidden=inConvo; if(c)c.hidden=!inConvo; if(fb)fb.hidden=!inConvo;
  const dF=$('#ddFind'),dC=$('#ddCatch'),dP=$('#ddPlan');
  if(dF)dF.hidden=!f.askFind; if(dC)dC.hidden=!f.askCatch; if(dP)dP.hidden=!f.askPlan;
  const pF=$('#pillFind'),pC=$('#pillCatch'),pP=$('#pillPlan');
  if(pF)pF.classList.toggle('open',!!f.askFind); if(pC)pC.classList.toggle('open',!!f.askCatch); if(pP)pP.classList.toggle('open',!!f.askPlan);

function renderAskConvo(f){ const c=cw(); let h='';

  if(f.inprogQuery){
    h+=`<div class="abubble user">In-progress cases — check for updates on your Working cases</div>`;
    h+=renderInprog(c);

function startTimer(){ if(timerH)return; timerH=setInterval(()=>{timerSec++;const t=$('#phoneTimer');
  if(t)t.innerHTML=`<span class="rd"></span>${String(Math.floor(timerSec/60)).padStart(2,'0')}:${String(timerSec%60).padStart(2,'0')}`;},1000); }
function stopTimer(){clearInterval(timerH);timerH=null;}
let toastH=null;
function toast(msg){ const t=$('#toast'); t.innerHTML=`<span class="ok">✓</span> ${msg}`; t.classList.add('show'); clearTimeout(toastH); toastH=setTimeout(()=>t.classList.remove('show'),2400); }
/* bell notifications */
let notifications=[];
function updateBell(){ const dot=$('#bellDot'),bell=$('#bell'),panel=$('#bellPanel');
  if(bell) bell.classList.toggle('on', notifications.length>0);
  if(dot) dot.textContent=notifications.length;
  if(panel) panel.innerHTML=`<div class="bp-h">Notifications</div>`+(notifications.length?notifications.map(n=>`<div class="notif"><span class="nic">${n.icon||'🔔'}</span><div><div class="nt">${n.title}</div><div class="ns">${n.sub}</div></div></div>`).join(''):`<div class="notif-empty">No notifications</div>`); }
function addNotif(id,title,sub,icon){ if(!notifications.find(n=>n.id===id)) notifications.push({id,title,sub,icon}); updateBell(); }
function removeNotif(id){ notifications=notifications.filter(n=>n.id!==id); updateBell(); }
function toggleBellPanel(force){ const panel=$('#bellPanel'); if(!panel)return; panel.hidden=(force===undefined)?!panel.hidden:!force; }
document.addEventListener('click',e=>{ const id=e.target.id;
  const bellEl=e.target.closest && e.target.closest('#bell');
  if(bellEl){ toggleBellPanel(); if(STEPS[idx]&&STEPS[idx].target==='#bell') next(); return; }
  const dkb=e.target.closest && e.target.closest('#draftKbBtn');
  if(dkb){ toast('Draft sent — a knowledge article is ready for review.'); if(STEPS[idx]&&STEPS[idx].target==='#draftKbBtn') next(); return; }
  if(!e.target.closest || !e.target.closest('#bellPanel')) toggleBellPanel(false);
  const wt=e.target.closest && e.target.closest('.wtab'); if(wt&&wt.dataset.tab){ showVoiceTab(wt.dataset.tab); }
  if(e.target.classList&&e.target.classList.contains('ib')&&e.target.dataset.act) toast(e.target.dataset.act+' — completed.');
  if(id==='emailSend')toast('Confirmation email sent to '+V.monitor.caller+'.');
  if(id==='issueCredit')toast('Provisional credit issued · Overdraft fee reversed.');
  if(id==='getRec')toast('Einstein generated the Automated Wrap-Up + Scorecard.');
  if(id==='wrapSave')toast('Automated Wrap-Up saved to the record.');
  if(id==='closePlanBtn'&&!e.target.disabled)toast('Case '+V.caseData.number+' closed · Wrap-up saved to record.'); });

/* ---------- boot ---------- */
function boot(){
  try{ if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)document.body.classList.add('reduced'); }catch(e){}
  const q=new URLSearchParams(location.search); if(q.get('org'))ORG.name=q.get('org'); if(q.get('hex'))ORG.hex=q.get('hex');
  const qv=q.get('vertical'); const startInDemo = qv && VMETA()[qv] && VMETA()[qv].ready;
  if(startInDemo) selectVertical(qv); else buildSteps();
  applyOrg();
  $('#btnPlay').onclick=togglePlay;
  $('#btnNext').onclick=()=>{pause();next();};
  $('#btnBack').onclick=back;
  $('#btnRestart').onclick=()=>{pause();const st=$('#stage');st.dataset.view='';st.innerHTML='';idx=0;timerSec=0;stopTimer();notifications=[];toggleBellPanel(false);_lastTrackedStep=-1;_fired={};render();};
  $('#ttToggle').onclick=()=>{talkTrack=!talkTrack;$('#ttToggle').classList.toggle('on',talkTrack);$('#guidebar').classList.toggle('talk-off',!talkTrack);};
  $('#btnCollapse').onclick=()=>{const c=$('#guidebar').classList.toggle('collapsed');$('#btnCollapse').textContent=c?'▴':'▾';$('#btnCollapse').title=c?'Show guide':'Hide guide';};
  // Voice toggle. Hidden entirely where synthesis is unavailable, so the control
  // never promises something the browser can't deliver. The click itself is the
  // user gesture that satisfies autoplay policy.
  if(audioSupported()){
    const au=$('#auToggle'); au.hidden=false;
    try{ AUDIO.on = localStorage.getItem(AUDIO_PREF)==='1'; }catch(e){ AUDIO.on=false; }
    au.classList.toggle('on',AUDIO.on);
    if(AUDIO.on) startKeepAlive();
    pickVoices();
    try{ speechSynthesis.onvoiceschanged=pickVoices; }catch(e){}
    au.onclick=()=>{
      AUDIO.on=!AUDIO.on;
      au.classList.toggle('on',AUDIO.on);
      try{ localStorage.setItem(AUDIO_PREF, AUDIO.on?'1':'0'); }catch(e){}
      if(AUDIO.on){ pickVoices(); startKeepAlive(); }
      else { cancelAudio(); stopKeepAlive(); }
    };
  }
  if(startInDemo) go(1); else render();
  track('demo_opened',{ deepLink:startInDemo?qv:'' });
}
boot();
